# Pal5 local-prior test arm (2026-09-23): identical to `stream_agama_spray_legacy_pal5` (legacy
# global prior, Chen spray, 10^4 particles, legacy progenitor m = 4.3e3 / a = 8.43 pc / t_end = 4)
# except the Pal5 PRESENT-DAY PHASE SPACE, taken from the Baumgardt GC database
# (people.smp.uq.edu.au/HolgerBaumgardt/globular/orbits_table.txt, fetched 2026-09-23) — the
# BV21/VB21 source already used for NGC3201/M68, never applied to Pal5 until now:
#   ra, dec   229.019167, -0.121          (was 229.022, -0.112)
#   r         21.94 +/- 0.51 kpc          (was 20.6 +/- 0.2, RR Lyrae, Price-Whelan+2019)
#   vr        -58.61 +/- 0.15 km/s        (was -58.6 +/- 0.21)
#   mu_ra*    -2.754 +/- 0.028 mas/yr     (was -2.736 +/- 0.064)
#   mu_dec    -2.643 +/- 0.026 mas/yr     (was -2.646 +/- 0.064)
# The pm errors are the database's statistical 0.017/0.014 in quadrature with the ~0.022 mas/yr
# Gaia EDR3 systematic floor (Vasiliev & Baumgardt 2021), matching the NGC3201/M68 convention.
# Caveat kept from 2026-09-21: BV21's distance averages moduli that are not all extinction
# corrected; the 1.3 kpc (6.6 sigma) shift vs the RR Lyrae 20.6 is the dominant change here.
defaults:
  - stream_agama_spray_legacy_pal5

params:
  priors_local:
    Pal5:
      ra:
        type: identity
        prior_parameters: [229.019167]
      dec:
        type: identity
        prior_parameters: [-0.121]
      vr:
        type: normal
        prior_parameters: [-58.61, 0.15]
      r:
        type: normal
        prior_parameters: [21.94, 0.51]
      mu_ra_cosdec:
        type: normal
        prior_parameters: [-2.754, 0.028]
      mu_dec:
        type: normal
        prior_parameters: [-2.643, 0.026]
