# rc38 with the Eilers et al. (2019) rotation curve (assets/rotation_curve_eilers19.csv, 38 radii 5.27-24.82 kpc;
# sigma = mean of the asymmetric errors) in place of Jiao26, whose steep outer decline (-4.5 km/s/kpc over 12-26 kpc)
# only 59/3e5 rc38 prior curves reach and which put the real data out of distribution in the learned summary
# (outputs/ood_rotation_curve_diagnosis/). mask_vcirc_radii (r_min 5.5) drops the 5.27 kpc point -> 37 radii seen.
# Everything else is rc38 verbatim. Datasets: vcirc_kms recomputed with AGAMA per row by
# scripts/recompute_vcirc_grid.py from the rc38 x Jiao26 sets (streams are not re-simulated).
defaults:
  - stream_agama_spray_massloss_ibata_m200c_v4_prog2026_rc38

params:
  obs_r_grid: custom
  obs_r_kpc: [5.27, 5.74, 6.23, 6.73, 7.22, 7.82, 8.19, 8.78, 9.27, 9.76, 10.26, 10.75, 11.25, 11.75, 12.25, 12.74, 13.23, 13.74, 14.24, 14.74, 15.22, 15.74, 16.24, 16.74, 17.25, 17.75, 18.24, 18.74, 19.22, 19.71, 20.27, 20.78, 21.24, 21.8, 22.14, 22.73, 23.66, 24.82]
