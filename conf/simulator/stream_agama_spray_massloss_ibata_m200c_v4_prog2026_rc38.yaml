# rc38 = the rc37 set (stream_agama_spray_massloss_ibata_m200c_v4_prog2026_rc37: Chen spray + linear
# mass loss, 2026-09-22 progenitor table, t_end U[2,5], 37-radius rotation curve, in-window storage
# cap) with a McMillan (2017)-like stellar disk whose mass follows the halo (2026-10-01, per user).
# STANDALONE (no `defaults:`): Hydra cannot delete inherited keys, and rc37's Sigma_Disk / r_Disk /
# z_Disk must not exist here. Every block except priors_global and the disk flags was copied from the
# resolved rc37 config; tests/test_rc38_potential.py asserts they stay equal.
#
# SAMPLED globals (config order == draw order; no rejection of any kind, vcirc_rejection: null):
#   gamma U[0,1.5], q U[0.5,1.5], log10_M200 U[11.6,12.4] (halo-only, 200 rho_crit; was U[11.5,12.5]:
#   there 99 % of draws below 11.6 had v_c(R0) < 180 km/s — changed per user 2026-10-01),
#   ln_cvprime N(2.56,0.272), log10_Mstar ~ N(mu_moster(log10_M200), 0.2) (Moster+2013),
#   ln_R_d_thin N(ln 2.6,0.2), ln_R_d_thick N(ln 3.6,0.2), ln_f_thick N(ln 0.12,0.1)  -> 8 INFERRED;
#   R0_Sun, U/V/W_Sun as rc37 -> NUISANCE (marginalize: drawn + used, never inferred).
# DERIVED per row (stored as *_derived, never sampled or inferred): M_bulge (totalMass of the fixed
#   McMillan bulge, ~8.96e9), M_disk = max(10^log10_Mstar - M_bulge, M_disk_floor), Sigma/M/R_d of the
#   thin and thick disks, f_thick, disk_mass_floored, M(<50 kpc), v_c(R0), halo densityNorm/scaleRadius.
#   f_thick is rho_thick/rho_thin at (R0_Sun, z_sun=0.0208), so the Sigmas depend on the row's R0_Sun.
# FIXED: z_thin 0.3 / z_thick 0.9 kpc, the McMillan (2017) bulge (rho_Bulge 9.93e10) and HI/H2 gas disks.
# agama_vertical_sign: correct -> stellar disks EXPONENTIAL (h > 0), gas disks sech^2 (h < 0). rc37
#   and older use the legacy (inverted) signs; see _stellar_hsign / _gas_disks in stream_agama.py.
