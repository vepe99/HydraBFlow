# B-spline (orbit + DeltaTheta(phi1)) surrogate with the Baumgardt-DB (BV21/VB21) Pal5 phase-space
# prior instead of the RR Lyrae / Price-Whelan+2019 one (2026-09-23 local-prior test). Everything
# else = stream_orbit_offset_mcmillan17_v4 (template, v4 m200_c globals). Values and caveats: see
# stream_agama_spray_legacy_pal5_bv21.yaml. m/a/t_end stay pinned (the template's frozen history).
defaults:
  - stream_orbit_offset_mcmillan17_v4

params:
  priors_local:
    Pal5:
      ra:
        type: identity
        prior_parameters: [229.019167]
      dec:
        type: identity
        prior_parameters: [-0.121]
      vr:
        type: normal
        prior_parameters: [-58.61, 0.15]
      r:
        type: normal
        prior_parameters: [21.94, 0.51]
      mu_ra_cosdec:
        type: normal
        prior_parameters: [-2.754, 0.028]
      mu_dec:
        type: normal
        prior_parameters: [-2.643, 0.026]
