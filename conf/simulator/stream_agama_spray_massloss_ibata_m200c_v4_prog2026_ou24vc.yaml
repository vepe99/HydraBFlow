# prog2026 spray v4 (stream_agama_spray_massloss_ibata_m200c_v4_prog2026) with the rotation-curve observable
# swapped for the Ou et al. 2024 CIRCULAR-VELOCITY table (user, 2026-09-30; copy in
# assets/rotation_curve_ou24_vcirc.csv): 37 radii 6.27-27.31 kpc (was the 19-radius 6.6-25.5 kpc curve), per-bin
# sigma = (sigma_minus + sigma_plus)/2. vcirc_kms becomes (n, 37, 1); fill_stream_grid_from_simulator pushes these
# radii / sigmas / observed values into mask_vcirc_radii, add_noise_to_vcirc and attach_observed_vcirc. Every radius
# is > r_min 5.5, so nothing is masked. The stored dataset has vcirc_kms recomputed on this grid
# (scripts/recompute_vcirc_grid.py): data_jarvis/data_agama_spray_massloss_ibata_m200c_v4_p1e3_prog2026_ou24vc_hydrabflow.
