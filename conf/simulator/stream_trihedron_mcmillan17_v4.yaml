# Streams generated by Frenet-Serret remapping of ONE restricted-N-body run, over the v4 m200_c
# potential prior.
#
# Forward model: `stream_trihedron` (src/hydrabflow/simulators/stream_trihedron.py). Each row
# re-integrates only the progenitor's orbit in that row's potential and drops the template's stored
# trihedron offsets onto the new orbit — ~40 ms per stream against ~10-30 s for the restricted
# N-body at 10^4 particles.
#
# ---------------------------------------------------------------------------------------------
# The template
# ---------------------------------------------------------------------------------------------
# Built by scripts/build_trihedron_template.py from
#   data_local/mcmillan17_mean_tend_best/mcmillan17_mean.npz
# = one restricted-N-body realization with every parameter at its prior mean, in the McMillan (2017)
# potential held fixed, at t_end 2.5 / 3.5 / 3.5 Gyr (the stripping ages the 2026-09-22 scan
# recommended: the only ages at which NGC3201 and M68 produce a populated stream while their
# progenitors still exist, with M68's tails no longer remnant-dominated).
#
# Window +-0.6 Gyr, 6001 knots (0.2 Myr spacing). Measured diagnostics, all three streams:
#   boundary_frac = 0.0000   the window contains the whole stream; no star's nearest orbit point
#                            lies outside it, so no t_hat label is pinned to an endpoint.
#   ambiguous_frac <= 0.006  Pal5 0.0015, NGC3201 0.0059, M68 0.0000 — the orbit re-crosses itself
#                            within the window for a handful of stars, whose label is not unique.
#   |remap - fiducial| <= 9e-8 kpc   remapping into the fiducial potential returns the very cloud
#                            the template was built from, i.e. the template is a faithful
#                            description of that simulation.
#
# ---------------------------------------------------------------------------------------------
# What this config can and cannot infer
# ---------------------------------------------------------------------------------------------
# FREE: every global potential parameter (they change the progenitor's orbit, which is exactly what
# the remap re-integrates) and the four present-day phase-space coordinates vr / r / mu_ra_cosdec /
# mu_dec, which keep the inherited BV21/VB21 measurement-error normals from the base
# stream_agama.yaml. So local_parameter_names == [vr, r, mu_ra_cosdec, mu_dec].
#
# PINNED, and it must stay that way: m_progenitor, a_progenitor and t_end are baked into the stored
# offsets — the template IS a particular stripping history — so they are identity-pinned at the
# fiducial values below. TrihedronStreamSimulator._check_template_matches_priors raises if a config
# frees them, because a freed one would enter local_parameter_names and the network would be trained
# to infer a parameter the forward model ignores.
#
# ---------------------------------------------------------------------------------------------
# Two caveats to carry into any result from this dataset
# ---------------------------------------------------------------------------------------------
# 1. The template's exact point lies OUTSIDE this prior family. The fiducial is McMillan17 (thin +
#    thick isothermal stellar disks, halo with no outer cutoff); the inherited v4 family is a single
#    exponential disk with halo_r_t_kpc = 1000. The v4 family was chosen for comparability with the
#    existing v4/v5 datasets and models, at the price that no row reproduces the fiducial exactly.
#    Measured offset (build_trihedron_template.py --compare-simulator): the fiducial halo corresponds
#    to log10 M200 = 12.110, ln c' = 2.738 (McMillan's own Table 3 values, recovered to 0.004), and
#    v_circ differs from this prior's centre by a median 9.4 % / max 10.6 % over 2-60 kpc.
# 2. t_hat is frozen, so the remap cannot redistribute stars ALONG the track. A halo-flattening
#    change bends the orbit sideways (captured by the stored perpendicular offsets); a halo-MASS
#    change is mostly an orbital-period rescaling (not captured). The 2026-08-28 sweeps measured the
#    remap losing to particle spray on the mass axis for every stream, and this prior spans
#    log10 M200 in [11.6, 12.4]. Validation against restricted-N-body truth over this prior was
#    skipped by decision, so the surrogate bias along the mass axis is UNMEASURED.
#
# Also: the remap replays the fiducial's already-stripped population, so it reports no
# m_bound_final and cannot represent potential-dependent progenitor survival.
defaults:
  - stream_agama_rnbody_ibata_m200c_v4

name: stream_trihedron
params:
  trihedron_template: data_local/mcmillan17_mean_tend_best/trihedron_template.npz

  # n_particles is ignored by this simulator (the template's star count is what gets remapped, 10^4
  # here); store_window_subsample, the Ou+2024 19-radius vcirc grid, the m200_c halo priors, the
  # marginalized solar frame and vcirc_rejection: null are all inherited from v4 unchanged.

  priors_local:
    # The stripping history frozen into the template. These MUST equal the fiducial run's values.
    Pal5:
      m_progenitor:
        type: identity
        prior_parameters: [1.39e4]
      a_progenitor:
        type: identity
        prior_parameters: [27.34]
      t_end:
        type: identity
        prior_parameters: [2.5]
    NGC3201:
      m_progenitor:
        type: identity
        prior_parameters: [1.49e5]
      a_progenitor:
        type: identity
        prior_parameters: [4.75]
      t_end:
        type: identity
        prior_parameters: [3.5]
    M68:
      m_progenitor:
        type: identity
        prior_parameters: [1.23e5]
      a_progenitor:
        type: identity
        prior_parameters: [5.91]
      t_end:
        type: identity
        prior_parameters: [3.5]
