# Restricted-N-body Ibata / m200_c simulator, NFW halo: same as v2 in every respect EXCEPT that the
# dark halo is pinned to the FLATTENED NFW profile instead of a free two-power (alpha, gamma) family.
#
# Inherits stream_agama_rnbody_ibata_m200c_v2 wholesale — corrected + freed progenitors, no
# rotation-curve rejection prior, free p / tilt / rho_Bulge, free t_end U[2,10] for all three
# streams, marginalized Solar frame. Read that file's header for all of it.
#
# ---------------------------------------------------------------------------------------------
# What changes: gamma = 1, alpha = 1 (beta is already identity 3.0 up the chain).
# ---------------------------------------------------------------------------------------------
# AGAMA's Spheroid density is
#
#     rho(r) = densityNorm / [ x^gamma (1 + x^alpha)^((beta - gamma)/alpha) ],   x = r_ellip / a
#
# so (alpha, beta, gamma) = (1, 3, 1) IS the NFW profile, rho = rho0 / [x (1+x)^2]. AGAMA has a
# native `type=NFW` too, but it is SPHERICAL ONLY — axisRatioY / axisRatioZ are documented for the
# Spheroid / Nuker / Sersic / Dehnen / Ferrers families, not for NFW. So the flattened NFW is
# expressed as the Spheroid with those three exponents pinned, keeping axisRatioZ = q free (and
# axisRatioY = p, and the tilt, from v2). Measured: no force-evaluation cost difference vs the free
# (alpha, gamma) halo (4.0 vs 4.2 ms per 20k forces on the full host potential), so the restricted
# N-body cost per row is unchanged.
#
# WHY pin them (the reason this variant exists):
#
#   1. It removes the gamma-r_h coupling that made gamma rail. Under the m200_c parameterization
#      r_h = r200 / [c200 (2 - gamma)], so gamma is not a shape parameter at fixed (M200, c) — it
#      rescales the halo. At gamma = 1 this collapses to the textbook NFW relation r_s = r200 / c200
#      exactly (verified: M200 = 1.3e12, c_v' = 15.4 -> r_s = 19.70 kpc = r200/c200, and
#      enclosedMass(r200) / M200 = 1.000000 at q = 0.8 as well as q = 1). Nothing in the m200_c
#      machinery is approximate here either: convert_concentration's 94 -> 200 inversion uses the NFW
#      m(c), which is EXACT at gamma = 1 and only approximate away from it.
#   2. gamma ~ 1.75 — where the free-gamma posteriors piled up — is not a physical Milky Way inner
#      slope (empirical values cluster at 0.4-1.0), and at fixed (M200, c) it was the only knob that
#      could simultaneously raise inner v_c (the under-predicted HI terminal velocity, R = 4.2-7.5
#      kpc) and lower the outer curve (Huang's declining profile). v2 freed alpha to give that shape
#      an honest route; this variant tests the stronger, and more standard, hypothesis that the halo
#      is a plain NFW and the inner-mass mismatch belongs to the baryons (freed rho_Bulge,
#      Sigma_Disk up to 3e9) rather than to the dark cusp.
#   3. Two fewer inferred dimensions (9 global parameters, down from 11), and the prior no longer
#      spends draws on halo shapes that no cosmological simulation produces.
#
# The cost of pinning is real and worth stating: an NFW halo cannot produce a cored or a
# steeper-than-NFW inner profile, so if the streams genuinely prefer one, this model will absorb the
# mismatch into the disc/bulge and the flattening q. That is the point of running it as a SEPARATE
# dataset alongside v2 rather than replacing it — the two are directly comparable (same progenitors,
# same nuisances, same observables), so the comparison localizes whether the free halo exponents were
# buying real fit quality or only soaking up a parameterization artefact.
defaults:
  - stream_agama_rnbody_ibata_m200c_v2

name: stream_agama_rnbody
params:
  priors_global:
    # NFW: rho = rho0 / [x (1+x)^2]. All three exponents fixed => not inferred (identity entries are
    # fixed constants, and the adapter derives the inferred set from the non-identity priors), so the
    # halo's free parameters are exactly (M200, c_v', q, p, tilt).
    gamma_TwoPowerTriaxial_halo:
      type: identity
      prior_parameters: [1.0]
    alpha_TwoPowerTriaxial_halo:
      type: identity
      prior_parameters: [1.0]
