# stream_fusion_2modal with the sim_summary backbone swapped for a plain TimeSeriesTransformer (no bin
# masking). "Old grid" = the shared estimator with `summary_scale: std` (augmentation=stream_global_ibata_grid,
# or any grid preset + `augmentation.params.summary_scale=std`): out-of-range stars are still excluded and
# bins below summary_min_count still read 0, but the 14-channel layout INCLUDING the n_track/n_vlos counts
# reaches the network as features (verified on the v4_2modal_legacy_oldgrid weights: input width 21 =
# 13 features + 8 time-embedding). No channel contract, so the same yaml serves the 9-channel `_nodisp` grid.
# Ablation of the v2 estimator alone -- grouped_diffusion, head: null and the curve branch unchanged.
type: fusion
params:
  mask_backbone: null
  head: null                   # required by grouped_diffusion (see stream_fusion_2modal.yaml)
  backbones:
    sim_summary:
      type: time_series_transformer
      summary_dim: 32
      num_blocks: 3
      num_heads: 4
      dropout: 0.1
      embed_dim_per_head: 8
      params:
        time_axis: -1          # last channel of sim_summary is the phi1 bin-centre
    vcirc_kms:
      type: time_series_transformer
      summary_dim: 62
      num_blocks: 5
      num_heads: 6
      dropout: 0.1
      embed_dim_per_head: 11
