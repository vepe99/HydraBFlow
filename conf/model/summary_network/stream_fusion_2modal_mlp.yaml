# MLP ablation of stream_fusion_2modal: same two modalities, same occupancy handling, same output
# widths — only the architecture consuming each observable changes, from a transformer to a plain
# MLP over the flattened input. That isolates "does attention over the φ1 bins / the rotation-curve
# radii buy anything?" from every other choice.
#
# sim_summary keeps the masked prep (masked_mlp): under-populated bins are zeroed and the occupancy
# channels never reach the network as values, exactly as in the transformer arm. There is no
# attention or pooling to mask — the grid is flattened, so an empty bin is a block of zeros at a
# fixed position.
#
# head: null is REQUIRED by grouped_diffusion (see stream_fusion_2modal.yaml).
type: fusion
params:
  mask_backbone: null
  head: null
  backbones:
    sim_summary:
      type: masked_mlp
      summary_dim: 32          # == the transformer arm, so the group widths are unchanged
      mlp_depth: 3
      mlp_width: 256
      dropout: 0.1
      params:
        count_channel: 10        # n_track
        vlos_count_channel: 11   # n_vlos
        stat_channels: [0, 1, 2, 3, 4, 5, 6, 7]
        vlos_stat_channels: [8, 9]
        min_count: 3
    vcirc_kms:
      type: mlp
      summary_dim: 62          # == the transformer arm
      mlp_depth: 3
      mlp_width: 256
      dropout: 0.1
