# Occupancy-aware variant of stream_fusion_ibata_grid: same fusion model and inference network, but
# the sim_summary backbone is the `masked_time_series_transformer`, which reads the per-bin occupancy
# channels stream_summary_grid now exports and excludes under-populated φ1 bins from attention AND
# from pooling. See conf/model/summary_network/stream_fusion_ibata_grid_masked.yaml for the rationale
# and the channel-index contract.
#
# Pair with adapter=stream_ibata_sumstats, augmentation=stream_global_ibata_grid (or the _v2 preset),
# preprocessing=stream_global_log10_ibata_sumstats, composition=global.
defaults:
  - base_model
  - summary_network: stream_fusion_ibata_grid_masked
  - inference_network: diffusion
  - _self_

name: stream_fusion_ibata_grid_masked
inference_network:
  mlp_depth: 2
  mlp_width: 48
  time_embedding_dim: 20
