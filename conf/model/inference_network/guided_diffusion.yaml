# Diffusion model whose reverse-time score can be nudged by the simulator's likelihood gradient.
# Implementation: src/hydrabflow/networks/guided_diffusion.py
#
# Guidance is a SAMPLING-time modification: none of these knobs affect training, so one trained
# network serves an entire guidance sweep. They can also be overridden at eval time via
# `eval.guidance` (see conf/eval/lv_guided.yaml) without retraining.
defaults:
  - base_inference_network

type: guided_diffusion
mlp_depth: 4
mlp_width: 128
dropout: 0.05
time_embedding_dim: 32

params:
  # --- guidance strength and gating ---
  # Sampling integrates t = 1 -> 0. Guidance is off for t >= t_on and ramps smoothly (smoothstep) to
  # full strength by t <= t_full. t_on=0.1 is the "last 10% only" variant under study; t_on=1.0
  # recovers standard DPS (guidance everywhere) and is the reference point of a t_on sweep.
  guidance_strength: 1.0
  t_on: 0.10
  t_full: 0.05
  # none | snr | norm_matched. `none` is literal DPS-lite and the correct choice when the diffusion
  # model represents the prior (Arm A). `snr` (alpha^2/sigma^2) makes guidance grow with the score as
  # t -> 0. `norm_matched` keeps only the gradient direction, at |guidance| = strength * |score|.
  scaling: none

  # --- particle (median) guidance ---
  # x_hat_0 is the MEAN of the denoising posterior p(x_0 | z_t), whose spread is sigma_t/alpha_t. For a
  # nonlinear forward model the gradient at that mean is not representative of the gradient over the
  # spread: measured over a 0.1 -> 4 prior-sd spread, cos(g_point, g_averaged) falls 0.997 -> 0.000.
  # Evaluating the gradient at K particles across the spread and taking the COMPONENTWISE MEDIAN keeps
  # the direction aligned (~0.65 toward the truth at a 4-sd spread) where the MEAN cancels to ~0.00 --
  # per-particle gradients are heavy-tailed, and the median is robust to that.
  #
  # guidance_particles=1 is the plain Tweedie-point gradient (bit-for-bit the pre-particle behaviour).
  # K is folded into the batch axis, so one gradient call covers all particles: guidance is
  # launch-bound, not FLOP-bound, and K=32 is nearly free. Use K >= 16 (see particle_seed).
  guidance_particles: 1
  guidance_reduce: median   # point | mean | median
  particle_width: 1.0       # multiplier on the denoising-posterior std
  # Scale of the parameters the diffusion model was trained on (for LV: the log-rate prior std, 0.5).
  # The cloud width is the EXACT Gaussian denoising-posterior std,
  #   s * sigma_t / sqrt(alpha_t^2 s^2 + sigma_t^2),
  # which equals sigma_t/alpha_t at low noise but saturates at s -- the denoising posterior can never
  # be wider than the prior. Using the naive sigma_t/alpha_t instead is unusable: it reaches 80 at
  # t=1 against a prior std of 0.5, so every particle saturates the parameter soft-clip and the
  # gradient underflows to exactly zero, silently disabling guidance at large t.
  particle_data_std: 0.5
  # The K unit normals are drawn once from this seed and REUSED at every integration step (common
  # random numbers): fresh noise per step would make the ODE vector field stochastic and fight the
  # integrator. The cost is a fixed bias, mitigated by using enough particles.
  particle_seed: 0

  # --- preconditioning: none | pigdm ---
  # `pigdm` replaces the raw gradient with an uncertainty-inflated Gaussian update,
  #   g = (sigma_obs^2 I + r_t^2 J^T J)^-1 J^T r,   r_t = sigma_t/alpha_t,  J = d log f / d theta,
  # which is the fix for the central problem measured in this study: a score correction moves the
  # denoised parameters by sigma_t^2/alpha_t, and that factor spans 80 (t=1) to 1e-8 (t=0). Since the
  # raw gradient's magnitude is ~constant in t, the induced shift spans 2.7e6 to 7e-3 -- overwhelming
  # or invisible, with no constant strength in between. PiGDM makes |g| scale INVERSELY with the lever,
  # so the induced shift is a bounded bump peaking at ~0.9 (prior sd = 0.5) around t=0.33.
  # r_t = 0 recovers the plain gradient, so it strictly generalizes DPS-lite.
  # Requires BaseSimulator.jax_gaussian_observation_model. Use with scaling=none, strength=1.0 --
  # the magnitude is already principled, so rescaling it defeats the purpose.
  precondition: none

  # --- numerical safety (pick these with scripts/diagnose_guidance.py, don't guess) ---
  max_grad_norm: 1.0e3    # per-row gradient-norm clip; non-finite rows are zeroed first
  clip_theta_std: 4.0     # smooth tanh squash of the denoised estimate into +-N prior std
  # Skip the simulator entirely (via jax.lax.cond) for t > t_on. The ramp alone only *masks* the
  # result — inside a traced loop the gradient would still be computed at every step, wasting ~90%
  # of the work at t_on=0.1. Set false only to debug the gating itself.
  skip_outside_window: true

  # --- sampler ---
  # Fixed-step deterministic ODE, overriding BayesFlow's default {two_step_adaptive, adaptive},
  # which is stochastic AND adaptive: an adaptive solver collapses its step size at the guidance
  # switch-on point, and on JAX the stochastic path preallocates max_steps noise arrays.
  integrate:
    method: rk45
    steps: 200
