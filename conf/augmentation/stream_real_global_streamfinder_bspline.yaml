# Real-data twin of `stream_global_streamfinder_bspline`.
defaults:
  - stream_real_global_ibata_grid_v2

steps:
  - sample_obs_error
  - impute_vlos
  - log10_vcirc
  - stream_bspline_grid
  - concatenate_sigma_errors
  - concatenate_magnitudes
  - concatenate_vlos_mask
  - concatenate_stream_index

params:
  bspline_interior_knots: 5
  bspline_vlos_interior_knots: 1
  bspline_grid_points: 20
  bspline_ridge: 1.0e-3
  bspline_model_selection: none     # none | cv: per (stream, observable) spline vs global poly1/2/3 by CV on the real members
  bspline_model_candidates: [poly1, poly2, poly3, spline]
  bspline_cv_folds: 10
  bspline_cv_repeats: 5
  bspline_models: {}                # explicit pins, win over cv: {M68: {vlos: poly1}}
