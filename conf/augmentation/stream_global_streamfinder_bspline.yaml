# B-spline observation space on the OLD observation model: `stream_global_ibata_grid_v2` (stream_global
# chain — member-table magnitudes, DR3 sigma(G) table, mean v_los impute, Ibata+2024 STREAMFINDER members
# 129/195/297) with the binned summary grid replaced by `stream_bspline_grid` (same knots/grid as
# `stream_global_palau23_dr3_bspline`). Pair with model=stream_fusion_2modal_oldgrid, adapter=stream_2modal
# and the real twin `stream_real_global_streamfinder_bspline`.
defaults:
  - stream_global_ibata_grid_v2

steps:
  - convert_distance_to_parallax
  - observational_window
  - observed_n_stars
  - compact_to_attended
  - contaminate_members
  - sample_magnitudes
  - sample_obs_error
  - apply_obs_error
  - mask_vlos
  - add_noise_to_vcirc
  - log10_vcirc
  - stream_bspline_grid
  - concatenate_sigma_errors
  - concatenate_magnitudes
  - concatenate_vlos_mask
  - concatenate_stream_index

params:
  bspline_interior_knots: 5
  bspline_vlos_interior_knots: 1
  bspline_grid_points: 20
  bspline_ridge: 1.0e-3
