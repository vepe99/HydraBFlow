# Real-data counterpart of `stream_global_palau23_dr3`: the Palau & Miralda-Escude (2023) members
# with Gaia DR3 astrometry (`assets/gaia/gaia_observed_streams_palau23_dr3.npz`). Same estimator
# settings and phi1 grid as that training chain; only the file and the counts differ from v5.
defaults:
  - stream_real_global_v5

params:
  real_streams_file: assets/gaia/gaia_observed_streams_palau23_dr3.npz
  observed_n_stars:
    Pal5: 126
    NGC3201: 71
    M68: 95
  min_star_with_vlos:
    Pal5: 17
    NGC3201: 18
    M68: 8
