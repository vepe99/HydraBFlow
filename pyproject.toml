[project]
name = "hydrabflow"
version = "0.1.0"
description = "Reusable cookiecutter template for BayesFlow + Hydra simulation-based inference (SBI) pipelines."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Giuseppe Viterbo", email = "viterbogiuseppe99@gmail.com" }]
dependencies = [
    # BayesFlow pinned to the git rev the protoplan branch uses: the modality-masking pieces
    # (utils.masks, DiffusionTransformer, observed_condition_mask plumbing) are not in PyPI 2.0.12.
    "bayesflow",
    "keras>=3.5",
    "jax[cuda12]>=0.4.30",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "optuna>=3.6",
    "numpy>=1.26",
    "autocvd",
    "matplotlib>=3.8",
    "marimo>=0.9",
    "tqdm>=4.66",
    "gpustat",
    # Stellar-stream simulators + their diagnostics.
    "astropy>=8.0.0",
    "joblib>=1.5.3",
    "scipy>=1.17.1",
    "pandas>=3.0.3",
    "plotly",
    "agama>=1.0.0",
    "corner>=2.2.3",
    "scikit-learn",
    "umap-learn>=0.5",
    "gala>=1.11.0",
]

# `uv sync` installs the dev group by default, so a fresh clone can run pytest immediately.
# setuptools/wheel are needed in the project env because agama builds without isolation (below).
[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "setuptools", "wheel"]

# The run stages. Each is also runnable as `python -m hydrabflow.pipeline.<stage>`.
# `evaluate` covers simulated and real data (set `data.real_data_path`); `simulate-multistream`
# writes the grouped (compositional) test sets used by `composition=global|local`.
[project.scripts]
hydrabflow-simulate = "hydrabflow.pipeline.simulate:cli"
hydrabflow-simulate-multistream = "hydrabflow.pipeline.simulate_multistream:cli"
hydrabflow-train = "hydrabflow.pipeline.train:cli"
hydrabflow-evaluate = "hydrabflow.pipeline.evaluate:cli"
hydrabflow-tune = "hydrabflow.pipeline.tune:cli"

# agama's setup.py imports numpy at build time, so it cannot build in an isolated env, and its
# interactive build prompts (download GSL/Eigen, reuse Makefile.local) need auto-confirmation.
[tool.uv]
# agama links GSL at build time. Its own GSL download can fail (no network / dead mirror), and a
# GSL it does build lands in uv's temp build dir and disappears, leaving `libgsl.so.NN not found`
# at import. If a rebuild breaks agama, point it at an existing GSL and rebuild:
#   GSL=/export/home/vgiusepp/miniforge3/envs/amuse_test_py313
#   CPATH=$GSL/include LIBRARY_PATH=$GSL/lib LDFLAGS="-L$GSL/lib -Wl,-rpath,$GSL/lib" \
#     uv sync --no-cache --reinstall-package agama
# The rpath is what makes it stick without LD_LIBRARY_PATH; check with
#   ldd .venv/lib/python3.13/site-packages/agama/agama.so | grep gsl
no-build-isolation-package = ["agama"]

[tool.uv.config-settings-package]
agama = { "--build-option" = "--yes" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydrabflow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
bayesflow = { git = "https://github.com/bayesflow-org/bayesflow", rev = "c4c0a594d67f5e32d9b5bdab008a0900d0f9210d" }
