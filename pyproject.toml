[project]
name = "hydrabflow"
version = "0.1.0"
description = "Reusable cookiecutter template for BayesFlow + Hydra simulation-based inference (SBI) pipelines."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Giuseppe Viterbo", email = "viterbogiuseppe99@gmail.com" }]
dependencies = [
    "bayesflow",
    "keras>=3.5",
    "jax[cuda12]>=0.4.30",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "optuna>=3.6",
    "numpy>=1.26",
    "autocvd",
    "matplotlib>=3.8",
    "marimo>=0.9",
    "tqdm>=4.66",
    "gpustat",
    # Reached by the protoplanetary-disk instrument model
    # (src/hydrabflow/augmentation/protoplan_instrument.py) only.
    "scipy>=1.12",  # interpn, on jax arrays via SCIPY_ARRAY_API
    "stpsf",        # the JWST NIRSpec IFU PSF; needs its reference data via $STPSF_PATH
    # Reached by notebooks/prior_predictive_checks/ only: the real-disk observations are dill
    # pickles carrying their class definition inline.
    "dill",
]

# `uv sync` installs the dev group by default, so a fresh clone can run pytest immediately.
[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

# The four run stages. Each is also runnable as `python -m hydrabflow.pipeline.<stage>`.
[project.scripts]
hydrabflow-simulate = "hydrabflow.pipeline.simulate:cli"
hydrabflow-train = "hydrabflow.pipeline.train:cli"
hydrabflow-evaluate = "hydrabflow.pipeline.evaluate:cli"
hydrabflow-tune = "hydrabflow.pipeline.tune:cli"

[tool.uv.sources]
bayesflow = { git = "https://github.com/bayesflow-org/bayesflow" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydrabflow"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
